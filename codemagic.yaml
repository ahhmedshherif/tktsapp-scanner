workflows:
  android-release:
    name: TKTSAPP Scanner Android
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - tktsapp_public
        - tktsapp_android_signing
    scripts:
      - name: Prepare Flutter toolchain
        script: flutter config --no-enable-swift-package-manager
      - name: Clean Flutter build artifacts
        script: flutter clean
      - name: Get Flutter packages
        script: flutter pub get
      - name: Configure Android upload signing
        script: |
          test -n "$CM_KEYSTORE" && test -n "$CM_KEY_ALIAS" && test -n "$CM_KEY_PASSWORD" && test -n "$CM_KEYSTORE_PASSWORD"
          echo "$CM_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build APK and app bundle
        script: |
          flutter build appbundle --release --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=ONESIGNAL_APP_ID=$ONESIGNAL_APP_ID
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab

  ios-release:
    name: TKTSAPP Scanner iOS
    max_build_duration: 60
    # This key is stored only in Codemagic's Apple Developer Portal integration.
    # It has App Manager access and is never present in the repository.
    integrations:
      app_store_connect: TKTS Apple Portal
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - tktsapp_public
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tktsapp.tktsappScanner
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod repo update
          pod install
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Apply Codemagic App Store signing profile
        script: xcode-project use-profiles
      - name: Build IPA
        script: flutter build ipa --release --build-number=$BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=ONESIGNAL_APP_ID=$ONESIGNAL_APP_ID
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload the IPA to App Store Connect, but do not automatically submit
        # it to external TestFlight beta review. Internal testers can use the
        # processed build immediately; external review remains deliberate.
        submit_to_testflight: false
        submit_to_app_store: false
